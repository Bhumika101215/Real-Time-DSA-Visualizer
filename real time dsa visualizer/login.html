<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-950">

<div class="absolute inset-0 bg-[radial-gradient(circle_at_top,#1e40af30,transparent_50%)]"></div>

<div class="relative w-full max-w-md p-8 rounded-3xl bg-slate-900/90 border border-slate-700 shadow-2xl">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white">Welcome Back</h1>
        <p class="text-slate-400 mt-2">Sign in to continue</p>
    </div>

   <form action="index.html">

    <input type="email"
    placeholder="Email Address"
    class="w-full p-3 mb-4 rounded-xl bg-slate-800 text-white border border-slate-700 focus:border-blue-500 outline-none"
    required>

    <input type="password"
    placeholder="Password"
    class="w-full p-3 mb-6 rounded-xl bg-slate-800 text-white border border-slate-700 focus:border-blue-500 outline-none"
    required>

    <button type="submit"
    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition">
        Login
    </button>

</form>
    <p class="text-center text-slate-400 mt-6">
        Don't have an account?
        <a href="signup.html" class="text-blue-400 hover:text-blue-300">
            Sign Up
        </a>
    </p>

</div>

</body>
</html>
