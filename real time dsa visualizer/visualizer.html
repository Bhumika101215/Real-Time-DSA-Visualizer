<body>


    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
    <label for="speed" style="color: white; font-size: 14px; font-weight: bold;">
        Speed: <span id="speedVal">500</span>ms
    </label>
    <input 
        type="range" 
        id="speed" 
        min="50" 
        max="1500" 
        value="500" 
        step="50"
        oninput="updateSpeed(this.value)">
</div>
<button id="pauseBtn" onclick="togglePause()" style="background: #4ab8ef; color: black; margin-center: 10px;">
    Pause 
</button>
<div class="container">

<h1>Sorting Visualizer</h1>

<div class="controls">

<input
type="text"
id="arrayInput"
placeholder="Example: 50,20,80,10,40">

<select id="algorithm">
<option value="bubble">Bubble Sort</option>
<option value="merge">Merge Sort</option>
<option value="quick">Quick Sort</option>
<option value="selection">Selection Sort</option>
<option value="insertion">Insertion Sort</option>
<option value="heap">Heap Sort</option>
</select>

<button onclick="startSort()">
Start Visualization
</button>

</div>

<div id="explanation">
Enter values and start visualization.
</div>

<div class="visualizer" id="barsContainer"></div>

</div>

<script>


      // Script ke sabse upar (barsContainer ke paas) ise declare karein
let animationSpeed = 500; 
let isPaused = false;
let resolvePause;



function togglePause() {
    const pauseBtn = document.getElementById("pauseBtn");
    
    isPaused = !isPaused; // State flip karein (true -> false ya false -> true)

    if (isPaused) {
        pauseBtn.innerText = "Resume ▶️";
        pauseBtn.style.background = "#22c55e"; // Green color for resume
        pauseBtn.style.color = "white";
    } else {
        pauseBtn.innerText = "Pause ⏸️";
        pauseBtn.style.background = "#eab308"; // Yellow color for pause
        pauseBtn.style.color = "black";
        
      
        if (resolvePause) {
            resolvePause();
        }
    }
}


function updateSpeed(val) {
    animationSpeed = parseInt(val);
    document.getElementById("speedVal").innerText = val;
}


const barsContainer =
document.getElementById("barsContainer");

// Purane sleep function ko isse replace karein
// Apne purane sleep function ko isse replace karein
async function sleep() {
    // Pehle speed delay ke liye rukte hain
    await new Promise(resolve => setTimeout(resolve, animationSpeed));

    // Agar pause press kiya gaya hai, toh yahan ruk jao jab tak resume na ho
    if (isPaused) {
        await new Promise(resolve => {
            resolvePause = resolve; // Resume button dabte hi ye resolve call hoga
        });
    }
}

function setExplanation(text){
document.getElementById("explanation")
.innerText=text;
}

function createBars(arr){

barsContainer.innerHTML="";

arr.forEach(value=>{

const bar =
document.createElement("div");

bar.classList.add("bar");

bar.style.height =
(value*10)+"px";

bar.innerText=value;

barsContainer.appendChild(bar);

});

}

let email = "student@gmail.com";

let algorithm =
document.getElementById("algorithm").value;

let array =
document.getElementById("arrayInput").value;

fetch("save_history.php",{

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:
"email="+email+
"&algorithm="+algorithm+
"&array="+array

}



async function bubbleSort(arr){

const bars =
document.querySelectorAll(".bar");

for(let i=0;i<arr.length;i++){

for(let j=0;j<arr.length-i-1;j++){

bars[j].classList.add("compare");
bars[j+1].classList.add("compare");

setExplanation(
`Comparing ${arr[j]} and ${arr[j+1]}`
);

await sleep(500);

if(arr[j] > arr[j+1]){

[arr[j],arr[j+1]] =
[arr[j+1],arr[j]];

bars[j].style.height =
arr[j]*10+"px";

bars[j+1].style.height =
arr[j+1]*10+"px";

bars[j].innerText=arr[j];
bars[j+1].innerText=arr[j+1];

await sleep(500);

}

bars[j].classList.remove("compare");
bars[j+1].classList.remove("compare");

}

bars[arr.length-i-1]
.classList.add("sorted");

}

setExplanation(
"Bubble Sort Completed ✅"
);

}

/* Merge Sort */
async function mergeSortVisual(arr) {
    const bars = document.querySelectorAll(".bar");

    async function merge(l, m, r) {
        let n1 = m - l + 1;
        let n2 = r - m;

        let L = arr.slice(l, m + 1);
        let R = arr.slice(m + 1, r + 1);

        let i = 0, j = 0, k = l;

        while (i < n1 && j < n2) {
            bars[k].classList.add("compare");
            setExplanation(`Comparing sub-arrays elements: ${L[i]} and ${R[j]}`);
            await sleep(400);

            if (L[i] <= R[j]) {
                arr[k] = L[i];
                i++;
            } else {
                arr[k] = R[j];
                j++;
            }
            bars[k].style.height = arr[k] * 10 + "px";
            bars[k].innerText = arr[k];
            bars[k].classList.remove("compare");
            k++;
        }

        while (i < n1) {
            arr[k] = L[i];
            bars[k].style.height = arr[k] * 10 + "px";
            bars[k].innerText = arr[k];
            i++; k++;
            await sleep(200);
        }

        while (j < n2) {
            arr[k] = R[j];
            bars[k].style.height = arr[k] * 10 + "px";
            bars[k].innerText = arr[k];
            j++; k++;
            await sleep(200);
        }
    }

    async function mergeSortHelper(l, r) {
        if (l < r) {
            let m = Math.floor((l + r) / 2);
            await mergeSortHelper(l, m);
            await mergeSortHelper(m + 1, r);
            await merge(l, m, r);
        }
    }

    await mergeSortHelper(0, arr.length - 1);
    bars.forEach(bar => bar.classList.add("sorted"));
    setExplanation("Merge Sort Completed ✅");
}

/* Quick Sort */

async function quickSortVisual(arr) {
    const bars = document.querySelectorAll(".bar");
    
    async function partition(low, high) {
        let pivot = arr[high];
        bars[high].classList.add("compare"); // Pivot ko highight karna
        setExplanation(`Choosing ${pivot} as Pivot`);
        await sleep(400);

        let i = low - 1;

        for (let j = low; j < high; j++) {
            bars[j].classList.add("compare");
            if (arr[j] < pivot) {
                i++;
                [arr[i], arr[j]] = [arr[j], arr[i]];
                bars[i].style.height = arr[i] * 10 + "px";
                bars[j].style.height = arr[j] * 10 + "px";
                bars[i].innerText = arr[i];
                bars[j].innerText = arr[j];
                await sleep(400);
            }
            bars[j].classList.remove("compare");
        }

        [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
        bars[i + 1].style.height = arr[i + 1] * 10 + "px";
        bars[high].style.height = arr[high] * 10 + "px";
        bars[i + 1].innerText = arr[i + 1];
        bars[high].innerText = arr[high];
        
        bars[high].classList.remove("compare");
        bars[i + 1].classList.add("sorted"); // Pivot apni sahi jagah par aa gaya
        await sleep(400);

        return i + 1;
    }

    async function quickSortHelper(low, high) {
        if (low <= high) {
            let pi = await partition(low, high);
            await quickSortHelper(low, pi - 1);
            await quickSortHelper(pi + 1, high);
        }
    }

    await quickSortHelper(0, arr.length - 1);
    bars.forEach(bar => bar.classList.add("sorted"));
    setExplanation("Quick Sort Completed ✅");
}
async function selectionSortVisual(arr) {
    const bars = document.querySelectorAll(".bar");

    for (let i = 0; i < arr.length; i++) {
        let minIdx = i;
        bars[minIdx].classList.add("compare");

        for (let j = i + 1; j < arr.length; j++) {
            bars[j].classList.add("compare");
            setExplanation(`Comparing ${arr[j]} with current minimum ${arr[minIdx]}`);
            await sleep(400);

            if (arr[j] < arr[minIdx]) {
                bars[minIdx].classList.remove("compare");
                minIdx = j;
                bars[minIdx].classList.add("compare");
            } else {
                bars[j].classList.remove("compare");
            }
        }

        if (minIdx !== i) {
            setExplanation(`Swapping ${arr[i]} and ${arr[minIdx]}`);
            [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];

            // DOM Heights update karna
            bars[i].style.height = arr[i] * 10 + "px";
            bars[minIdx].style.height = arr[minIdx] * 10 + "px";
            bars[i].innerText = arr[i];
            bars[minIdx].innerText = arr[minIdx];
            await sleep(400);
        }

        bars[minIdx].classList.remove("compare");
        bars[i].classList.add("sorted");
    }
    setExplanation("Selection Sort Completed ✅");
}

async function insertionSortVisual(arr) {
    const bars = document.querySelectorAll(".bar");

    for (let i = 1; i < arr.length; i++) {
        let key = arr[i];
        let j = i - 1;

        setExplanation(`Picking ${key} to insert in sorted subarray`);
        bars[i].classList.add("compare");
        await sleep(400);

        while (j >= 0 && arr[j] > key) {
            bars[j].classList.add("compare");
            setExplanation(`Shifting ${arr[j]} to the right`);
            
            arr[j + 1] = arr[j];
            bars[j + 1].style.height = arr[j + 1] * 10 + "px";
            bars[j + 1].innerText = arr[j + 1];
            
            await sleep(400);
            bars[j].classList.remove("compare");
            j--;
        }
        
        arr[j + 1] = key;
        bars[j + 1].style.height = key * 10 + "px";
        bars[j + 1].innerText = key;
        bars[i].classList.remove("compare");
        await sleep(400);
    }

    // Pura array sorted hone ke baad sabhi bars ko sorted color dena
    bars.forEach(bar => bar.classList.add("sorted"));
    setExplanation("Insertion Sort Completed ✅");
}

/* Heap Sort */

async function heapSortVisual(arr) {
    const bars = document.querySelectorAll(".bar");
    let n = arr.length;

    async function heapify(n, i) {
        let largest = i;
        let l = 2 * i + 1;
        let r = 2 * i + 2;

        if (l < n && arr[l] > arr[largest]) largest = l;
        if (r < n && arr[r] > arr[largest]) largest = r;

        if (largest !== i) {
            bars[i].classList.add("compare");
            bars[largest].classList.add("compare");
            setExplanation(`Heapifying: Swapping ${arr[i]} and ${arr[largest]}`);
            
            [arr[i], arr[largest]] = [arr[largest], arr[i]];
            bars[i].style.height = arr[i] * 10 + "px";
            bars[largest].style.height = arr[largest] * 10 + "px";
            bars[i].innerText = arr[i];
            bars[largest].innerText = arr[largest];
            
            await sleep(400);
            bars[i].classList.remove("compare");
            bars[largest].classList.remove("compare");

            await heapify(n, largest);
        }
    }

}
